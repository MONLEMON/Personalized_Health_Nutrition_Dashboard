<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="vp-bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2EE6A6" stop-opacity="0.22" />
      <stop offset="62%" stop-color="#38BDF8" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#0A0C10" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="vp-orb-fill" cx="36%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1D2C38" />
      <stop offset="55%" stop-color="#0F1822" />
      <stop offset="100%" stop-color="#080D14" />
    </radialGradient>
    <linearGradient id="vp-orb-rim" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#2EE6A6" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="vp-specular" x1="25%" y1="10%" x2="70%" y2="75%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.34" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Full-bleed Obsidian Background -->
  <rect width="512" height="512" rx="116" fill="#0A0C10" />
  <circle cx="256" cy="256" r="230" fill="url(#vp-bg-glow)" />

  <!-- Outer Concentric Macro Rings (Mint, Sky, Amber) -->
  <circle cx="256" cy="256" r="192" stroke="#2EE6A6" stroke-opacity="0.14" stroke-width="5" />
  <circle
    cx="256"
    cy="256"
    r="192"
    stroke="#2EE6A6"
    stroke-width="6.5"
    stroke-dasharray="940 300"
    stroke-linecap="round"
    transform="rotate(-90 256 256)"
  />

  <circle cx="256" cy="256" r="168" stroke="#38BDF8" stroke-opacity="0.14" stroke-width="5" />
  <circle
    cx="256"
    cy="256"
    r="168"
    stroke="#38BDF8"
    stroke-width="6.5"
    stroke-dasharray="760 320"
    stroke-linecap="round"
    transform="rotate(-90 256 256)"
  />

  <circle cx="256" cy="256" r="144" stroke="#FFB020" stroke-opacity="0.16" stroke-width="5" />
  <circle
    cx="256"
    cy="256"
    r="144"
    stroke="#FFB020"
    stroke-width="6.5"
    stroke-dasharray="560 360"
    stroke-linecap="round"
    transform="rotate(-90 256 256)"
  />

  <!-- Center Dark-Glass Biometric Orb -->
  <circle
    cx="256"
    cy="256"
    r="112"
    fill="url(#vp-orb-fill)"
    stroke="url(#vp-orb-rim)"
    stroke-width="5"
  />
  <ellipse cx="256" cy="202" rx="68" ry="38" fill="url(#vp-specular)" />

  <!-- Crisp Minimal ECG Pulse Line -->
  <path
    d="M 186 258 L 216 258 L 228 242 L 242 280 L 256 212 L 270 296 L 284 244 L 296 258 L 326 258"
    stroke="#2EE6A6"
    stroke-opacity="0.45"
    stroke-width="14"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M 186 258 L 216 258 L 228 242 L 242 280 L 256 212 L 270 296 L 284 244 L 296 258 L 326 258"
    stroke="#E8FFF7"
    stroke-width="7.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
